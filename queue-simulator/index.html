
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queue Data Structure Simulator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <script src="https://code.jquery.com/jquery-3.6.3.min.js"></script>
    <script src="queue.js" defer></script>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center text-white mb-4">
            Queue Data Structure Simulator
        </h1>

        <div class="row">
            <div class="col-md-4">
                <h3 class="text-white">Operations</h3>

                <input
                    type="text"
                    id="queueInput"
                    class="form-control mb-3"
                    placeholder="Enter a value"
                >

                <button id="enqueueBtn" class="btn btn-primary w-100 mb-2">
                    Enqueue
                </button>

                <button id="dequeueBtn" class="btn btn-danger w-100 mb-2">
                    Dequeue
                </button>

                <button id="peekBtn" class="btn btn-warning w-100 mb-2">
                    Peek
                </button>

                <button id="clearBtn" class="btn btn-secondary w-100 mb-3">
                    Clear
                </button>

                <p id="message" class="text-white fw-bold"></p>
            </div>

            <div class="col-md-5">
                <h3 class="text-white">Queue Visualization</h3>

                <div class="d-flex justify-content-between text-white mb-2">
                    <span id="frontLabel">Front: —</span>
                    <span id="rearLabel">Rear: —</span>
                </div>

                <div id="queue" class="queue-container"></div>
            </div>

            <div class="col-md-3">
                <h3 class="text-white">Dequeued Element</h3>
                <div id="deleted" class="popped"></div>
            </div>
        </div>
    </div>
</body>
</html>
